  <script>
    // Render project cards from JSON
    (function(){
      function h(tag, cls){ var el=document.createElement(tag); if(cls) el.className=cls; return el; }
      function cardTpl(p){
        var card = h('div','box project-card');
        card.setAttribute('data-video', p.video||'');
        card.setAttribute('data-poster', p.poster||'');
        var img = h('img','project-poster');
        img.src = p.poster; img.alt = p.title + ' poster'; img.loading='lazy';
        card.appendChild(img);
        var overlay = h('button','play-overlay'); overlay.setAttribute('aria-label','Play preview'); overlay.textContent='▶';
        card.appendChild(overlay);
        var detail = h('div','detail-box');
        var h5 = h('h5'); h5.textContent = p.title; detail.appendChild(h5);
        var pEl = h('p'); pEl.textContent = p.summary || ''; detail.appendChild(pEl);
        card.appendChild(detail);
        card.addEventListener('project:open', function(){
          // Placeholder for modal/detail navigation
        });
        return card;
      }
      // Prefer backend API if running via Flask; fallback to static JSON
      var url = (location.port === '5000') ? '/api/projects' : 'data/projects.json';
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(list){
          var grid = document.getElementById('projects-grid');
          if (!grid) return;
          list.forEach(function(p){ grid.appendChild(cardTpl(p)); });
        })
        .catch(function(){ /* ignore */ });
    })();
  </script>
