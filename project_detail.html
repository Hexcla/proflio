<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Project Detail</title>
  <link rel="stylesheet" type="text/css" href="bootstrap.css" />
  <link href="style.css" rel="stylesheet" />
  <link href="responsive.css" rel="stylesheet" />
  <link href="css/theme.css" rel="stylesheet" />
  <style>
    .detail-hero{padding-top:40px;padding-bottom:30px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
    .tag{padding:6px 10px;border:1px solid var(--card-border);border-radius:20px;font-size:12px}
    .video-wrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
    .video-wrap video,.video-wrap iframe{width:100%;height:100%}
    .steps{margin-top:24px}
    .step{border-left:4px solid #4b208c;padding-left:12px;margin:14px 0}
    .step h5{margin:0 0 4px 0}
    .links a{display:inline-block;margin-right:12px}
  </style>
  <script>
    (function(){
      function getParam(name){ const u=new URL(location.href); return u.searchParams.get(name)||''; }
      function h(tag, cls){ var el=document.createElement(tag); if(cls) el.className=cls; return el; }
      function render(p){
        document.title = p.title + ' - Project';
        document.getElementById('title').textContent = p.title;
        document.getElementById('summary').textContent = p.summary||'';
        var tags = document.getElementById('tags');
        (p.tags||[]).forEach(function(t){ var span=h('span','tag'); span.textContent=t; tags.appendChild(span); });
        var wrap = document.getElementById('media');
        if (p.video) {
          if (/^https?:\/\//.test(p.video)) {
            // Simple embed for YouTube/Vimeo links if provided
            var iframe = h('iframe');
            iframe.src = p.video; iframe.allow = 'autoplay; encrypted-media'; iframe.frameBorder='0';
            wrap.appendChild(iframe);
          } else {
            var vid = h('video'); vid.controls=true; vid.playsInline=true; vid.src=p.video; if(p.poster) vid.poster=p.poster; wrap.appendChild(vid);
          }
        } else {
          var img = h('img'); img.src=p.poster; img.alt=p.title; img.style.width='100%'; wrap.appendChild(img);
        }
        function sec(id, text){ if(!text) return; document.getElementById(id).textContent = text; }
        var cs = p.caseStudy||{};
        sec('prob', cs.problem); sec('approach', cs.approach); sec('impl', cs.implementation); sec('res', cs.results); sec('learn', cs.learnings);
        
        // Handle data science specific sections
        var dsSections = document.getElementById('ds-sections');
        var hasDSData = false;
        
        if (cs.modelArchitecture) {
          document.getElementById('model-arch').textContent = cs.modelArchitecture;
          hasDSData = true;
        }
        if (cs.dataPipeline) {
          document.getElementById('data-pipeline').textContent = cs.dataPipeline;
          hasDSData = true;
        }
        if (cs.performanceMetrics) {
          document.getElementById('perf-metrics').textContent = cs.performanceMetrics;
          hasDSData = true;
        }
        if (cs.deployment) {
          document.getElementById('deployment').textContent = cs.deployment;
          hasDSData = true;
        }
        
        if (hasDSData) {
          dsSections.style.display = 'block';
        }
        
        var links = document.getElementById('links');
        if (p.repo) { var a=h('a'); a.href=p.repo; a.textContent='Repository'; a.target='_blank'; a.rel='noopener'; links.appendChild(a); }
        if (p.demo) { var a2=h('a'); a2.style.marginLeft='12px'; a2.href=p.demo; a2.textContent='Live Demo'; a2.target='_blank'; a2.rel='noopener'; links.appendChild(a2); }
        // Optional extra steps breakdown
        var steps = p.steps || [
          {title:'Plan', text:'Requirements, constraints, and success metrics.'},
          {title:'Design', text:'System design, data flow, and UX/UI decisions.'},
          {title:'Build', text:'Implementation details and libraries used.'},
          {title:'Test', text:'Unit/integration tests and validation.'},
          {title:'Deliver', text:'Deployment, docs, and monitoring.'}
        ];
        var stepsWrap = document.getElementById('steps');
        steps.forEach(function(s){
          var d=h('div','step');
          var hh=h('h5'); hh.textContent=s.title; d.appendChild(hh);
          var pp=h('p'); pp.textContent=s.text; d.appendChild(pp);
          stepsWrap.appendChild(d);
        });
      }
      function init(){
        var slug = getParam('slug');
        var url = (location.port === '5000') ? '/api/projects' : 'data/projects.json';
        fetch(url).then(function(r){return r.json();}).then(function(list){
          var p = (list||[]).find(function(it){return it.slug===slug}) || list[0];
          if (p) render(p);
        }).catch(function(){});
      }
      if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</head>
<body class="sub_page">
  <div class="container detail-hero">
    <a href="project.html">← Back to Projects</a>
    <h2 id="title"></h2>
    <p id="summary"></p>
    <div class="tags" id="tags"></div>
    <div class="video-wrap" id="media"></div>
    <div class="links" style="margin-top:18px" id="links"></div>
  </div>

  <div class="container" style="margin-bottom:30px">
    <h3>Case Study</h3>
    <h5>Problem</h5>
    <p id="prob"></p>
    <h5>Approach</h5>
    <p id="approach"></p>
    <h5>Implementation</h5>
    <p id="impl"></p>
    <h5>Results</h5>
    <p id="res"></p>
    <h5>Learnings</h5>
    <p id="learn"></p>
    
    <!-- Data Science Specific Sections -->
    <div id="ds-sections" style="display: none;">
      <h5>Model Architecture</h5>
      <p id="model-arch"></p>
      
      <h5>Data Pipeline</h5>
      <p id="data-pipeline"></p>
      
      <h5>Performance Metrics</h5>
      <p id="perf-metrics"></p>
      
      <h5>Deployment & Scaling</h5>
      <p id="deployment"></p>
    </div>
    
    <div class="steps" id="steps"></div>
  </div>

  <script src="jquery-3.4.1.min.js"></script>
  <script src="bootstrap.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
